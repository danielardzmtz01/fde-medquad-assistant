# .github/workflows/terraform_static_infra.yml
name: "Terraform Layer 1: Static Infra & NCC Hub"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

jobs:
  terraform-static:
    name: 'Terraform Static Infra'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/layer1_static_infra
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_ADMIN_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SA }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="admin_project_id=${{ secrets.GCP_ADMIN_PROJECT_ID }}"

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve -var="admin_project_id=${{ secrets.GCP_ADMIN_PROJECT_ID }}"
